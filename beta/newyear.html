<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title id="appsList-title">Список приложений — TenStore</title>
	  <link id="appsList-icon" rel="shortcut icon" href="images/apps.svg" type="image/png">
		<link href="styles/desktop.css" rel="stylesheet" type="text/css">
		<link href="styles/settings.css" rel="stylesheet" type="text/css">
		<link href="styles/newyear.css" rel="stylesheet" type="text/css">
		<link href="styles/mobile.css" rel="stylesheet" type="text/css">
		<!-- СКРИПТЫ -->
		<script src="scripts/theme.js"></script>
		<script src="scripts/tenid.js"></script>
		<script src="scripts/topBar.js"></script>
	</head>
	<body>
		<nav style="position: sticky; top: 0;">
			<ul id="topBar" style="display: flex; align-items: center">
				<a id="mLogo2">Приложения</a>
				<a id="logo">TENSTORE</a>
				<input type="text" id="siteSearch" class="textInput siteSearch" placeholder="Найти..."></input>
				<img onclick="userBox()" id="userPic" src="images/user.svg">
			</ul>
		</nav>
		<!-- ОКНО ПОЛЬЗОВАТЕЛЯ -->
		<div id="userBox">
			<div id="picDiv"><img id="boxPic" src="images/user.svg"></div>
			<h3 id="name" class="centerText"></h3>
			<h5 id="userbox-email" class="centerText"></h5>
			<button onclick="changeTheme(1)" id="themeButton" class="boxButton"><img src='images/light.svg' class='boxButton-icon'>Светлая тема</button>
			<form action="library"><button class="boxButton" id="boxbtn-library"><img src="images/library.svg" class="boxButton-icon">Библиотека</button></form>
			<form action="settings"><button class="boxButton" id="boxbtn-settings"><img src="images/settings.svg" class="boxButton-icon">Настройки</button></form>
			<form action="dev"><button class="boxButton" id="boxbtn-dev"><img src="images/developer.svg" class="boxButton-icon">Панель разработчика</button></form>
			<form action="user"><button id="boxBtn-account" class="boxButton"><img src="images/user.svg" class="boxButton-icon">Мой аккаунт</button></form>
			<form id="loginForm" action="login"><button onclick="logoff()" id="lastButton" class="boxButton"><img src='images/login.svg' class='boxButton-icon'>Войти</button></form>
		</div>
		<div id="shadowBox" style="margin: auto">
			<h1 id="remaining" class="rainbow rainbow_text_animated" style="font-size: 100px; margin-top: 100px" class="centerText"></h1>
			<h1 class="centerText">осталось до Нового Года.</h1>
			<svg viewBox="0 0 100 100" class="icon shape-codepen">
			  <use xlink:href="#shape-codepen"></use>
			</svg>
		</div>
		<script>login(); ub_themeBtn()</script>
		<script src="scripts/newyear.js"></script>
		<script src='scripts/search-bar.js'></script>
	</body>
</html>
