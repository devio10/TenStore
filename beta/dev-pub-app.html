<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Панель Разработчика — TenStore</title>
	  <link rel="shortcut icon" href="images/developer.svg" type="image/png">
		<link href="styles/desktop.css" rel="stylesheet" type="text/css">
		<link href="styles/mobile.css" rel="stylesheet" type="text/css">
		<link href="styles/TenID-basic.css" rel="stylesheet" type="text/css">
		<link href="styles/edit-account.css" rel="stylesheet" type="text/css">
		<link href="styles/dev.css" rel="stylesheet" type="text/css">
		<!-- СКРИПТЫ -->
		<script src="scripts/app-card.js"></script>
		<script src="scripts/theme.js"></script>
		<script src="scripts/tenid.js"></script>
		<script src="scripts/topBar.js"></script>
	</head>
	<body>
		<nav style="position: sticky; top: 0;">
			<ul id="topBar" style="display: flex; align-items: center">
				<a id="mLogo2">Панель Разработчика</a>
				<a id="logo">Панель Разработчика</a>
				<img onclick="userBox()" id="userPic" src="images/user.svg">
			</ul>
		</nav>
		<!-- ОКНО ПОЛЬЗОВАТЕЛЯ -->
		<div id="userBox">
			<h5 style="margin: 15px; font-family: var(--bold); float: left">TENID</h5>
			<img onclick="userBox()" src="images/cancel.svg" class="userBox-close">
			<div id="picDiv"><img id="boxPic" src="images/user.svg"></div>
			<h3 id="name" class="centerText"></h3>
			<form action="settings"><button class="boxButton"><img src="images/settings.svg" class="boxButton-icon">Настройки</button></form>
			<button onclick="changeTheme(1)" id="themeButton" class="boxButton"><img src='images/light.svg' class='boxButton-icon'>Светлая тема</button>
			<form action="https://thetenstore.ru/user"><button id="boxBtn-account" class="boxButton"><img src="images/user.svg" class="boxButton-icon">Аккаунт</button></form>
			<form action="https://thetenstore.ru/dev-index"><button id="boxBtn-dev" class="boxButton"><img src="images/developer.svg" class="boxButton-icon">Панель разработчика</button></form>
			<form action="https://t.me/nexta_live"><button class="boxButton"><img src="https://thetenstore.ru/images/belarus.svg" class="boxButton-icon">#ЖывеБеларусь</button></form>
			<form id="loginForm" action="login"><button onclick="logoff()" id="lastButton" class="boxButton"><img src='images/login.svg' class='boxButton-icon'>Войти</button></form>
		</div>

		<div id="pub-block1" class="CA-block">
			<img src="images/publish.svg" class="CA-block-icon">
			<h5 id="CA-block-title">ОПУБЛИКОВАТЬ ПРИЛОЖЕНИЕ</h5>
			<div style="display: grid">
				<div id="CA-picDiv" style="display: block"><img id="pub-app-icon" src='images/build.svg'><img class="pub-add-img" src="images/add-photo.svg"></div>

				<input style="margin-top: 100px" id="pub-app-name" placeholder="Название приложения" type="text" class="textInput CA-input">
				<input id="CA-login" placeholder="Логин" type="text" class="textInput CA-input">
				<div style="margin-top: 30px; display: block" id="EA-userBg-block">
					<img id="EA-userBg" src='https://thetenstore.ru/images/headers/6.jpg'>
					<img src="images/edit.svg" class="pub-add-img" id="bgEditIcon">
				</div>
			</div>
			<button onclick="CAFirst()" class="accentButton CA-button CA-right dev-button"><img class="buttonIcon" src='images/send.svg'></button>
		</div>

	</body>
</html>
