<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>TenStore</title>
	  <link rel="shortcut icon" href="images/favicon.png" type="image/png">
		<link href="styles/desktop.css" rel="stylesheet" type="text/css">
		<link href="styles/TenID-basic.css" rel="stylesheet" type="text/css">
		<link href="styles/user.css" rel="stylesheet" type="text/css">
		<link href="styles/mobile.css" rel="stylesheet" type="text/css">
		<!-- СКРИПТЫ -->
		<script src="scripts/theme.js"></script>
		<script src="scripts/tenid.js"></script>
	</head>
	<body style="background-image: url(images/dnavalny.png); background-attachment: fixed; object-fit: cover; background-position: center; background-repeat: no-repeat; background-size: cover">
		<nav style="position: sticky; top: 0;">
			<ul id="topBar" style="display: flex; align-items: center">
				<img onclick="goBack()" id="backButton" src="images/back2.svg">
				<a id="mLogo2">dnavalny</a>
				<a id="logo">TENID</a>
				<img onclick="userBox()" id="userPic" src="images/user.svg">
			</ul>
		</nav>
		<!-- ОКНО ПОЛЬЗОВАТЕЛЯ -->
		<div id="userBox">
			<h5 style="margin: 15px; font-family: var(--bold); float: left">TENID</h5>
			<img onclick="userBox()" src="images/cancel.svg" class="userBox-close">
			<div id="picDiv"><img id="boxPic" src="images/user.svg"></div>
			<h3 id="name" class="centerText"></h3>
			<form action="settings"><button class="boxButton"><img src="images/settings.svg" class="boxButton-icon">Настройки</button></form>
			<button onclick="changeTheme(1)" id="themeButton" class="boxButton"><img src='images/light.svg' class='boxButton-icon'>Светлая тема</button>
			<form action="https://thetenstore.ru/tenid"><button id="boxBtn-account" class="boxButton"><img src="images/user.svg" class="boxButton-icon">Аккаунт</button></form>
			<form action="https://t.me/nexta_live"><button class="boxButton"><img src="https://thetenstore.ru/images/belarus.svg" class="boxButton-icon">#ЖывеБеларусь</button></form>
			<form id="loginForm" action="login"><button onclick="logoff()" id="lastButton" class="boxButton"><img src='images/login.svg' class='boxButton-icon'>Войти</button></form>
		</div>

		<div class="CA-block" style="width: 550px; margin-bottom: 0">
			<img src="images/user.svg" class="CA-block-icon">
			<h5 id="CA-block-title">АККАУНТ</h5>
			<div id="CA-picDiv" style="display: block"><img id="CA-userPic" src="images/dnavalny.jpg"><img src="images/moderator.svg" id="kingIcon"></div>
			<h2 class="centerText">Дмитрий Навальный</h2>
			<h4 class="centerText">23 года, дизайнер из Санкт-Петербурга.</h4>
			<div style="display: flex; align-items: center; margin: 30px 0 20px 0">
				<button style="margin: 0 auto 0 auto" class="accentButton">Редактировать</button>
				<button style="margin: 0 auto 0 auto">Мои приложения</button>
			</div>
		</div>
		<div class="CA-block" style="width: 550px; margin-top: 40px; margin-bottom: 0">
			<h3 id="CA-block-title2">О себе</h3>
			<h4 id="CA-block-text">Дмитрий по кличке Навальный</h4>
			<h3 id="CA-block-title2">Связь</h3>
			<h4 id="CA-block-text">Telegram: <a>@dnavalny</a><br>
				Почта: скрыто<br>
				Twitter: скрыто<br>
				ВКонтакте: <a>@dmitrynavalny</a>
			</h4>
			<h3 id="CA-block-title2">Лучше купи Ryzen</h3>
			<h4 id="CA-block-text">2700 райзен</h4>
		</div>
		<script>login(); ub_themeBtn()</script>
	</body>
</html>
