<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Панель разработчика</title>
	  <link rel="shortcut icon" href="images/developer.svg" type="image/png">
		<link href="styles/desktop.css" rel="stylesheet" type="text/css">
		<link href="styles/settings.css" rel="stylesheet" type="text/css">
		<link href="styles/dev.css" rel="stylesheet" type="text/css">
		<link href="styles/mobile.css" rel="stylesheet" type="text/css">
		<!-- СКРИПТЫ -->
		<script src="scripts/tenid.js"></script>
		<script src="scripts/app-card.js"></script>
		<script src="scripts/theme.js"></script>
		<script src="scripts/topBar.js"></script>
		<script src="scripts/dev.js"></script>
	</head>
	<body>
		<nav style="position: sticky; top: 0;">
			<ul id="topBar" style="display: flex; align-items: center">
				<img onclick="goBack()" id="backButton" src="images/back2.svg">
				<a id="mLogo2">Панель разработчика</a>
				<a id="logo">Панель разработчика</a>
				<input id="siteSearch" type="text" class="textInput siteSearch" placeholder="Найти..."></input>
				<img onclick="userBox()" id="userPic" src="images/user.svg">
			</ul>
		</nav>
		<!-- ОКНО ПОЛЬЗОВАТЕЛЯ -->
		<div id="userBox">
			<div id="picDiv"><img id="boxPic" src="images/user.svg"></div>
			<h3 id="name" class="centerText"></h3>
			<h5 id="userbox-email" class="centerText"></h5>
			<button onclick="changeTheme(1)" id="themeButton" class="boxButton"><img src='images/light.svg' class='boxButton-icon'>Светлая тема</button>
			<form action="library"><button class="boxButton" id="boxbtn-library"><img src="images/library.svg" class="boxButton-icon">Библиотека</button></form>
			<form action="settings"><button class="boxButton" id="boxbtn-settings"><img src="images/settings.svg" class="boxButton-icon">Настройки</button></form>
			<form action="dev"><button class="boxButton" id="boxbtn-dev"><img src="images/developer.svg" class="boxButton-icon">Панель разработчика</button></form>
			<form action="https://thetenstore.ru/tenid"><button id="boxBtn-account" class="boxButton"><img src="images/user.svg" class="boxButton-icon">Мой аккаунт</button></form>
			<form id="loginForm" action="login"><button onclick="logoff()" id="lastButton" class="boxButton"><img src='images/login.svg' class='boxButton-icon'>Войти</button></form>
		</div>
		<div class="settings-nav">
			<div style="margin-top: 20px">
				<h4 onclick="changeTab('myapps', 'Мои приложения')" id="item-myapps" class="settings-nav-item"><img class="settings-subtitleIcon" src="images/apps.svg">Мои приложения</h4>
				<h4 onclick="changeTab('mygames', 'Мои игры')" id="item-mygames" class="settings-nav-item"><img class="settings-subtitleIcon" src="images/games.svg">Мои игры</h4>
				<h4 onclick="changeTab('publish', 'Опубликовать...')" id="item-publish" class="settings-nav-item"><img class="settings-subtitleIcon" src="images/plus.svg">Опубликовать...</h4>
				<h4 style="display: none" onclick="changeTab('news', 'Новости')" id="item-news" class="settings-nav-item"><img class="settings-subtitleIcon" src="images/news.svg">Новости</h4>
				<h4 style="display: none" onclick="changeTab('tenstoreapi', 'TenStore API')" id="item-tenstoreapi" class="settings-nav-item"><img class="settings-subtitleIcon" src="images/tenstore.svg">TenStore API</h4>
				<h4 style="display: none" onclick="changeTab('tenidapi', 'TenID API')" id="item-tenidapi" class="settings-nav-item"><img class="settings-subtitleIcon" src="images/api.svg">TenID API</h4>
			</div>
		</div>
		<div class="settings">
			<h2 id="dev-title" class="settings-tab" style="margin: 25px 0 30px 50px">Мои приложения</h2>
			<div id="dev-myapps" class="settings-tab">
				<div id="dev-myapps-list" class="dev-aCard-block"></div>
			</div>

			<div id="dev-mygames" style="display: none" class="settings-tab">
				<div id="dev-mygames-list" class="dev-aCard-block"></div>
			</div>

			<div id="dev-publish" style="display: none" class="settings-tab">

			</div>

			<div id="dev-news" style="display: none" class="settings-tab">

			</div>

			<div id="dev-tenstoreapi" style="display: none" class="settings-tab">

			</div>

			<div id="dev-tenidapi" style="display: none" class="settings-tab">

			</div>
			</div>
		</div>

		<script src="scripts/analytics.js"></script>
		<script>let theme; login(); currentThemeCheck(); checkSwitches(); onchangef(); ; ub_themeBtn()</script>
		<script>
			changeTab('myapps', 'Мои приложения');
			showAppCard('dev-myapps-list', 'images/appIcons/musicx.png', '15', '', '1', 'Music X — музыка ВКонтакте', '');
			showAppCard('dev-myapps-list', 'images/appIcons/files.png', '0', '', '36', 'Files UWP (Preview)', '');
			showAppCard('dev-myapps-list', 'images/appIcons/musicx.png', '15', '', '1', 'Music X — музыка ВКонтакте', '');
			showAppCard('dev-myapps-list', 'images/appIcons/files.png', '0', '', '36', 'Files UWP (Preview)', '');
			showAppCard('dev-myapps-list', 'images/appIcons/musicx.png', '15', '', '1', 'Music X — музыка ВКонтакте', '');

			showAppCard('dev-mygames-list', 'images/appIcons/musicx.png', '15', '', '1', 'Music X — музыка ВКонтакте', '');
			showAppCard('dev-mygames-list', 'images/appIcons/files.png', '0', '', '36', 'Files UWP (Preview)', '');
			showAppCard('dev-mygames-list', 'images/appIcons/musicx.png', '15', '', '1', 'Music X — музыка ВКонтакте', '');
			showAppCard('dev-mygames-list', 'images/appIcons/files.png', '0', '', '36', 'Files UWP (Preview)', '');
			showAppCard('dev-mygames-list', 'images/appIcons/musicx.png', '15', '', '1', 'Music X — музыка ВКонтакте', '');
		</script>
		<script src='scripts/search-bar.js'></script>
	</body>
</html>
