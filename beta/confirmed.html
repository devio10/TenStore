<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>TenID</title>
	  <link rel="shortcut icon" href="images/favicon.png" type="image/png">
		<link href="styles/desktop.css" rel="stylesheet" type="text/css">
		<link href="styles/mobile.css" rel="stylesheet" type="text/css">
		<link href="styles/TenID-basic.css" rel="stylesheet" type="text/css">
		<!-- СКРИПТЫ -->
		<script src="scripts/theme.js"></script>
		<script src="scripts/tenid.js"></script>
		<script src="scripts/topBar.js"></script>
	</head>
	<body>

		<nav>
			<ul id="topBar" style="display: flex; align-items: center">
				<img onclick="goBack()" id="backButton" src="images/back2.svg">
				<a id="mLogo">TENID</a>
				<a id="logo">TENID</a>
				<img onclick="userBox()" id="userPic" src="images/user.svg">
			</ul>
		</nav>
		<!-- ОКНО ПОЛЬЗОВАТЕЛЯ -->
		<div id="userBox">
			<h5 style="margin: 15px; font-family: var(--bold); float: left">TENID</h5>
			<img onclick="userBox()" src="images/cancel.svg" class="userBox-close">
			<div id="picDiv"><img id="boxPic" src="images/user.svg"></div>
			<h3 id="name" class="centerText"></h3>
			<form action="settings"><button class="boxButton"><img src="images/settings.svg" class="boxButton-icon">Настройки</button></form>
			<button onclick="changeTheme(1)" id="themeButton" class="boxButton"><img src='images/light.svg' class='boxButton-icon'>Светлая тема</button>
			<form action="https://thetenstore.ru/tenid"><button id="boxBtn-account" class="boxButton"><img src="images/user.svg" class="boxButton-icon">Аккаунт</button></form>
			<form action="https://t.me/nexta_live"><button class="boxButton"><img src="https://thetenstore.ru/images/belarus.svg" class="boxButton-icon">#ЖивеБеларусь</button></form>
			<form id="loginForm" action="login"><button onclick="logoff()" id="lastButton" class="boxButton"><img src='images/login.svg' class='boxButton-icon'>Войти</button></form>
		</div>

		<div style="display: none" id="CoA-code0" class="CA-block">
			<h5 style="margin: 20px; font-family: var(--bold)">ПОДТВЕРДИТЬ АККАУНТ</h5>
			<h3 style="margin: 50px 20px 0 20px">Вы подтвердили аккаунт</h3>
			<h4 style="margin: 20px 20px">Теперь вы можете устанавливать приложения и игры с TenStore, а также обновлять свои данные.</h4>
			<div style="display: flex; align-items: center">
				<button onclick="window.open('https://thetenstore.ru', '_self');" class="accentButton CA-button CA-right"><img src="images/home.svg" class="buttonIcon accentIcon">Главная</button>
			</div>
		</div>
		<div style="display: none" id="CoA-code1" class="CA-block">
			<h5 style="margin: 20px; font-family: var(--bold)">ПОДТВЕРДИТЬ АККАУНТ</h5>
			<h3 style="margin: 50px 20px 0 20px">Кажется, что-то пошло не так</h3>
			<h4 style="margin: 20px 20px">Сервер вернул код ошибки 1 (недействительная ссылка).</h4>
			<div style="display: flex; align-items: center">
				<button onclick="window.open('https://t.me/dnavalny', '_self');" class="accentButton CA-button CA-right">
					<img src="images/support.svg" class="buttonIcon accentIcon">Поддержка
				</button>
			</div>
		</div>

		<script>login(); ub_themeBtn(); LAcheckLogin(); confirmedPage()</script>
	</body>
</html>
