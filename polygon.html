<body>
	<h3 id="topNot"><a href="whatsNew" style="color: white">TenStore v2.0.1.0 БЕТА. ЧТО НОВОГО</a></h3>
	<a id="mLogo">TENSTORE</a>
	<nav>
		<ul class="title" style="display: flex; align-items: center">
			<a id="logo" style="font-family: var(--bold-font)">TENSTORE</a>
			<a id="spaceF">•</a>
			<a class="navItem" href="index">ГЛАВНАЯ</a>
			<a id="space">•</a>
			<a class="navItem" href="appsList">ПРИЛОЖЕНИЯ</a>
			<a id="space">•</a>
			<a class="navItem" href="games">ИГРЫ</a>
			<a id="space">•</a>
			<a class="navItem" href="tenid">TENID</a>
			<a id="space">•</a>
			<a class="navItem" href="polygon" style="font-family: var(--bold-font)">ПОЛИГОН</a>

			<div style="display: flex; align-items: center; visibility: hidden">
				<label id="mobileSwitch" style="visibility: hidden" class="themeSwitch" for="checkbox">
						<input type="checkbox" id="checkbox"/>
						<div class="slider round"></div>
				</label>
			</div>
			<a id="userName" onclick="showBox()"><img id="noUserPhoto" src="images/login.svg"></a>
			<img id="userPhoto" src="images/login.svg" style="display: none">
		</ul>
	</nav>

	<div id="userBox">
		<div id="boxPicDiv">
			<img id="boxUserPic" src="images/user.svg">
			<h3 id="name" style="width: 100%; text-align: center; margin: 10px 0 5px 0">Дмитрий Навальный</h3>
			<h3 id="login" style="width: 100%; text-align: center; margin: 0 0 5px 0; font-size: 12px">никнейм</h3>
			<h3 id="mail" style="width: 100%; text-align: center; margin: 0 0 30px 0; font-size: 12px">почта</h3>
		</div>
	</div>

	<div style="margin: 0 60px 0 60px">
	  <h2 style="font-family: var(--bold-font)">Тема</h2>
	  <label onclick="changeTheme('light')">
	    <input type="radio" name="theme" checked>
	    <span class="design"></span>
	    <span class="text">Светлая</span>
	  </label>
	  <label onclick="changeTheme('dark')">
	    <input type="radio" name="theme">
	    <span class="design"></span>
	    <span class="text">Темная</span>
	  </label>
	  <label onclick="changeTheme('black')">
	    <input type="radio" name="theme">
	    <span class="design"></span>
	    <span class="text">Черная</span>
	  </label>
	</div>

	<div style="margin: 0 60px 0 60px">
	  <h2 style="font-family: var(--bold-font)">Акцент</h2>
	  <label onclick="changeAccent('blue')">
	    <input type="radio" name="accent" checked>
	    <span class="design"></span>
	    <span class="text">Синий</span>
	  </label>
	  <label onclick="changeAccent('green')">
	    <input type="radio" name="accent">
	    <span class="design"></span>
	    <span class="text">Зеленый</span>
	  </label>
	  <label onclick="changeAccent('red')">
	    <input type="radio" name="accent">
	    <span class="design"></span>
	    <span class="text">Красный</span>
	  </label>
		<label onclick="changeAccent('ohSoOrange')">
	    <input type="radio" name="accent">
	    <span class="design"></span>
	    <span class="text">Оранжевый</span>
	  </label>
		<label onclick="changeAccent('purple')">
	    <input type="radio" name="accent">
	    <span class="design"></span>
	    <span class="text">Фиолетовый</span>
	  </label>
	</div>

	<button class="accentButton" style="margin: 30px 0 0 60px" onclick="showNot('ВСЁ РЕШЕНО', 'аоаоаоа')">кнопо4ка</button>

	<!-- новые карточки -->

		<div id="cardsList">
			<div class="card">
			  <div class="cardImage"> <img id="appIcon" src="images/empty.svg"/> </div>
			  <div class="cardTitle titleWhite">
			    <p id="appName">app name</p>
			  </div>
			</div>

		</div>

	<div id="notPlace">
		<!-- уведомления здесь -->
	</div>

	<div class="loader-wrapper">
		<span class="loader"><span class="loader-inner"></span></span>
	</div>

	<script type="text/javascript" src="https://code.jquery.com/jquery-3.5.0.min.js"></script>
	<script src="scripts/loadScreen.js"></script>
	<script src="scripts/closeNotification.js"></script>
	<script src="scripts/newNotification.js"></script>
	<script src="scripts/theme.js"></script>
	<script src="scripts/setupNot.js"></script>
	<script src="scripts/login.js"></script>
	<script src="scripts/version.js"></script>
	<script>getVersion()</script>
	<script>login()</script>
