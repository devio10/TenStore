<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>TenStore</title>
	<link href="style.css?v=1002" rel="stylesheet" type="text/css">
	<script>
		let key = "KdSqSAOC";
		let count = "more";
		let select = "type";
		value = "game";

		const request = new XMLHttpRequest();
		const url = "api.php";
		const params = "key=" + key+ "&count=" + count+ "&select=" + select+ "&value=" + value;
		request.responseType =	"json";
		request.open("POST", url, true);
		request.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
		request.addEventListener("readystatechange", () => {
	    if (request.readyState === 4 && request.status === 200) {
	    	let obj = request.response;
				for(let i=0; i<obj.apps.length; i++) {
				var aCard = document.createElement('div');
			  aCard.className = 'aCard';
			  aCard.innerHTML = "<a href='app.html?&select=id&value="+ obj.apps[i].id +"'> \
			  	<img class='aCardIcon' src='"+ obj.apps[i].icon +"'> \
			    <h3 class='aCardName'>"+ obj.apps[i].appname +"</h3> \
			    <h3 class='aCardDev'>"+ obj.apps[i].devname +"</h3> \
			  </a>"
				document.getElementById('aContainer').appendChild(aCard);
				}
			}
		});
		request.send(params);
	</script>
</head>

<body>
	<nav>
		<!--<a href="index.html" class="mobileLogo">TENSTORE</a>-->

			<a сlass="space">•</a>
			<a class="navItem" href="dev.html" style="font-family: 'NotoSans Regular'">API</a>
			<div style="display: flex; align-items: center">
				<label id="mobileSwitch" class="themeSwitch" for="checkbox">
						<input type="checkbox" id="checkbox" />
						<div class="slider round"></div>
				</label>
			</div>
			<h3 id="profileName">Dmitry Navalny</h3>
			<img class="profile" src="images/dnavalny.png">
		</ul>
	</nav>

	<h3>Все игры</h3>
	<div id="aContainer">

	</div>

	<div class="loader-wrapper">
		<span class="loader"><span class="loader-inner"></span></span>
