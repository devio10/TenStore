<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>TenID</title>
	  <link rel="shortcut icon" href="images/favicon.png" type="image/png">
		<link href="styles/desktop.css" rel="stylesheet" type="text/css">
		<link href="styles/TenID-basic.css" rel="stylesheet" type="text/css">
		<!-- СКРИПТЫ -->
		<script src="scripts/theme.js"></script>
		<script src="scripts/tenid.js"></script>
		<script src="scripts/topBar.js"></script>
		<script src="scripts/login.js"></script>
		<script src='scripts/phone-check.js'></script>
		<script src="https://unpkg.com/phosphor-icons"></script>
	</head>
	<body>
		<nav id="phoneNav" class="phone-navigation">
		  <a href="library" class="phoneNav-link">
		    <i class="ph-archive phoneNav-icon"></i>
		    <span class="phoneNav-text">Библиотека</span>
		  </a>
		  <a href="settings" class="phoneNav-link">
		    <i class="ph-gear-six phoneNav-icon"></i>
		    <span class="phoneNav-text">Настройки</span>
		  </a>
		  <a href="edit-account" class="phoneNav-link">
		    <i class="ph-pencil-simple phoneNav-icon"></i>
		    <span class="phoneNav-text">Редактирование</span>
		  </a>
			<a href="user" class="phoneNav-link">
		    <i class="ph-user-circle-fill phoneNav-icon phoneNav-link-active"></i>
		    <span class="phoneNav-text phoneNav-link-active">Профиль</span>
		  </a>
		</nav>
		<nav style="display: none">
			<ul id="topBar" style="display: flex; align-items: center">
				<img onclick="goBack()" id="backButton" src="images/back2.svg">
				<a id="mLogo2">ВОЙТИ В АККАУНТ</a>
				<a id="logo">TENID</a>
				<input id="siteSearch" type="text" class="textInput siteSearch" placeholder="Найти..."></input>
				<img onclick="userBox()" id="userPic" src="images/user.svg">
			</ul>
		</nav>
		<!-- ОКНО ПОЛЬЗОВАТЕЛЯ -->
		<div id="userBox">
			<div id="picDiv"><img id="boxPic" src="images/user.svg"></div>
			<h3 id="name" class="centerText"></h3>
			<h5 id="userbox-email" class="centerText"></h5>
			<button onclick="changeTheme(1)" id="themeButton" class="boxButton"><i class="ph-sun boxButton-icon"></i>Светлая тема</button>
			<form action="library"><button class="boxButton" id="boxbtn-library"><i class="ph-archive boxButton-icon"></i>Библиотека</button></form>
			<form action="settings"><button class="boxButton" id="boxbtn-settings"><i class="ph-gear-six boxButton-icon"></i>Настройки</button></form>
			<form action="dev"><button class="boxButton" id="boxbtn-dev"><i class="ph-code boxButton-icon"></i>Панель разработчика</button></form>
			<form action="user"><button id="boxBtn-account" class="boxButton"><i class="ph-user-circle boxButton-icon"></i>Мой аккаунт</button></form>
			<form id="loginForm" action="login"><button onclick="logoff()" id="lastButton" class="boxButton"><i class="ph-sign-in boxButton-icon"></i>Войти</button></form>
		</div>
		<div class="tenid-blocks">
			<div style="display: none" id="LA-alreadyLoggedIn" class="CA-block">
				<h5 id="CA-block-title">ВОЙТИ В АККАУНТ</h5>
				<h3 id="CA-block-title2">Вы уже вошли в аккаунт.</h3>
				<h4 id="CA-block-text">Перед тем как войти в новый, выйдите из текущего.</h4>
				<div style="display: flex; align-items: center">
					<button class="CA-button CA-left"><img src="images/back.svg" class="buttonIcon">Назад</button>
					<button class="accentButton CA-button CA-right"><img src="images/logout.svg" class="buttonIcon accentIcon">Выйти</button>
				</div>
			</div>

			<div id="LA-1step" class="tenid-block">
				<h1 class="tenid-title centerText">TENID</h1>
				<h4 style="margin-top: 5px" class="tenid-title centerText grey">Вход</h4>
				<div class="inputs-block">
					<input id="login" placeholder="Логин" type="text" class="textInput CA-input">
					<input id="password" placeholder="Пароль" type="password" class="textInput CA-input">
				</div>

				<div class="center-flex login-buttons">
					<a style="display: none" href="create-account" class="link CA-link">Создать аккаунт</a>
					<button onclick="LALogin()" class="accentButton CA-button CA-right"><i class="ph-key floatButton-icon publish-icon"></i></button>
				</div>
			</div>

			<div style="display: none" id="LA-2step" class="tenid-block">
				<h1 class="tenid-title centerText">TENID</h1>
				<h4 style="margin-top: 5px" class="tenid-title centerText grey">Вход</h4>
				<div class="LA-block1">
					<div id="LA-picDiv">
						<img id="LA-userPic" src="images/user.svg">
					</div>
					<h3 id="LA-name"></h3>
				</div>
				<div class="center-flex login-buttons">
					<button id="notMe-button" onclick="notMe()" class="accentButton CA-button CA-right">
						<i class="ph-x floatButton-icon login-button-icon"></i>
					</button>
					<button id="confirm-button" onclick="LASave()" class="accentButton CA-button CA-right">
						<i class="ph-check floatButton-icon login-button-icon"></i>
					</button>
				</div>
			</div>
		</div>

		<div id="alert">
			<img id="alertIcon" src="images/user.svg">
			<h4 id="alertText">Не удалось выполнить вход. Код ошибки: WRONG_PASS_OR_LOGIN</h4>
		</div>
		<script>login(); ub_themeBtn(); LAcheckLogin()</script>
		<script src='scripts/search-bar.js'></script>
	</body>
</html>
