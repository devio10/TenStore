<!DOCTYPE html>
<html lang="ru" dir="ltr">
  <head>
    <meta charset="utf-8">
    <link id="tab-icon" rel="shortcut icon" href="img/store-light.svg">
    <title>Войти в TenID — TenStore</title>
    <link rel="stylesheet" href="css/ui-elem.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/tenid.css">
    <link rel="stylesheet" href="css/ui-switch.css">

    <script src="https://unpkg.com/phosphor-icons"></script>
    <script src="js/theme.js" charset="utf-8"></script>
    <script src="js/mobile-version.js" charset="utf-8"></script>
    <script src="js/sha256.js" charset="utf-8"></script>
    <script src="js/xmlhttp.js" charset="utf-8"></script>

    <meta name="viewport" content="width=device-width, maximum-scale=1, minimum-scale=1" />
  </head>
  <body>
    <div class="ti-body-center">
      <div id="tenid-loading">
        <div class="ui-loading-wheel"> </div>
        <h5 class="ui-gray">Соединение с сервером</h5>
      </div>
      <div id="tenid-form1" style="display: none">
        <h4 class="ti-subtext">Вход в аккаунт</h4>
        <input id="ti-login" type="text" placeholder="TenID">
        <div class="ub-btn-family">
          <button class="ub-btn continue-btn">
            <i class="ph-arrow-right-bold ub-openbtn"></i>
            <h4 class="ub-btn-txt focus">Продолжить</h4>
          </button>
        </div>
        <input id="ti-pass" type="password" placeholder="Пароль">
        <h5 id="wrong-data" class="ui-gray">Указанные данные неверны. <a>Забыли пароль?</a></h5>
        <button id="login-btn" onclick='saveAccount()'>Войти</button>
        <h5 style="margin: 32px 0 0 0; text-align: center" class="ui-gray">или создать <a style="text-decoration: none" href='new-account'>новый аккаунт.</a></h5>

      </div>
      <div id="tenid-form2" style="display: none">
        <div class="ui-loading-wheel"> </div>
        <h5 class="ui-gray">Входим в аккаунт</h5>
      </div>
    </div>

    <script src="js/afterload.js"></script>
    <script src="js/ti-login.js"></script>
    <script type="text/javascript">
    </script>
  </body>
</html>
