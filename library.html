<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title id="appsList-title">Моя библиотека — TenStore</title>
	  <link id="appsList-icon" rel="shortcut icon" href="images/library.svg" type="image/png">
		<link href="styles/settings.css" rel="stylesheet" type="text/css">
		<link href="styles/desktop.css" rel="stylesheet" type="text/css">
		<link href="styles/appsList-elements.css" rel="stylesheet" type="text/css">
		<!-- СКРИПТЫ -->
		<script src="scripts/app-card.js"></script>
		<script src="scripts/theme.js"></script>
		<script src="scripts/tenid.js"></script>
		<script src="scripts/topBar.js"></script>
		<script src='scripts/phone-check.js'></script>
		<script src="https://unpkg.com/phosphor-icons"></script>
		<meta name="viewport" content="width=device-width, maximum-scale=1, minimum-scale=1" />
	</head>
	<body>
		<nav id="nav" style="position: sticky; top: 0;">
			<ul id="topBar" style="display: flex; align-items: center">
				<img onclick="goBack()" id="backButton" src="images/back2.svg">
				<input type="text" id="siteSearch" class="textInput siteSearch" placeholder="Найти..."></input>
				<img onclick="userBox()" id="userPic" src="images/user.svg">
			</ul>
		</nav>
		<nav class="phone-navigation">
		  <a href="appsList" class="phoneNav-link">
		    <i id="apps-i" class="ph-squares-four-fill phoneNav-icon phoneNav-link-active"></i>
		    <span id="apps-span" class="phoneNav-text phoneNav-link-active">Приложения</span>
		  </a>
		  <a href="appsList?type=game" class="phoneNav-link">
		    <i id="games-i" class="ph-game-controller phoneNav-icon"></i>
		    <span id="games-span" class="phoneNav-text">Игры</span>
		  </a>
		</nav>
		<div id="mobile-search-block">
			<input id="siteSearch-mobile" type="text" class="textInput siteSearch" placeholder="Найти..."></input>
			<button onclick="mobileSearch()" id="mobile-search-button">поиск</button>
		</div>
		<button onclick="toggleSearchBar()" id="mobileSearch" class="floatButton searchButton squareButton"><i class="ph-magnifying-glass-bold floatButton-icon"></i></button>
		<!-- ОКНО ПОЛЬЗОВАТЕЛЯ -->
		<div id="userBox">
			<div id="picDiv"><img id="boxPic" src="images/user.svg"></div>
			<h3 id="name" class="centerText"></h3>
			<h5 id="userbox-email" class="centerText"></h5>
			<button onclick="changeTheme(1)" id="themeButton" class="boxButton"><i class="ph-sun boxButton-icon"></i>Светлая тема</button>
			<form action="library"><button class="boxButton" id="boxbtn-library"><i class="ph-archive boxButton-icon"></i>Библиотека</button></form>
			<form action="settings"><button class="boxButton" id="boxbtn-settings"><i class="ph-gear-six boxButton-icon"></i>Настройки</button></form>
			<form action="dev"><button class="boxButton" id="boxbtn-dev"><i class="ph-code boxButton-icon"></i>Панель разработчика</button></form>
			<form action="user"><button id="boxBtn-account" class="boxButton"><i class="ph-user-circle boxButton-icon"></i>Мой аккаунт</button></form>
			<form id="loginForm" action="login"><button onclick="logoff()" id="lastButton" class="boxButton"><i class="ph-sign-in boxButton-icon"></i>Войти</button></form>
		</div>
		<div class="settings-nav hidden">
			<h4 id="item-rec-upd" class="settings-nav-item"><i class="ph-squares-four-bold settings-subtitleIcon"></i>Все</h4>
			<h4 class="settings-nav-item"><i class="ph-squares-four-bold settings-subtitleIcon"></i>Приложения</h4>
			<h4 class="settings-nav-item"><i class="ph-game-controller-bold settings-subtitleIcon"></i>Игры</h4>
		</div>


		<div class="settings appsList-block" style="margin-left: 0">
			<h2 id="dev-title" class="settings-tab">Библиотека</h2>
			<h4 id="no-elements" style="display: none">По вашему запросу ничего не нашлось.</h4>
			<div id="aCard-block" class="flex-grid">

			</div>
		</div>
		<script charset="utf-8" src="scripts/library.js"></script>
		<script>login(); ub_themeBtn(); ifNotFound()
			/*showAppCard('aCard-block', 'images/appIcons/notepads.png', '0', 'white', '36', 'Notepads', 'Jackie Liu');
			showAppCard('aCard-block', 'images/appIcons/edge.webp', '0', '', '36', 'Microsoft Edge', 'Microsoft');
			showAppCard('aCard-block', 'images/icons/microsoftNews.png', '0', 'white', '1', 'News', 'Microsoft');
			showAppCard('aCard-block', 'images/icons/orpad.png', '15', '', '1', 'Orpad — блокнот', 'Li_is');*/
		</script>
		<script src='scripts/search-bar.js'></script>
	</body>
</html>
