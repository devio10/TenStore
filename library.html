<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title id="appsList-title">Моя библиотека — TenStore</title>
	  <link id="appsList-icon" rel="shortcut icon" href="images/library.svg" type="image/png">
		<link href="styles/desktop.css" rel="stylesheet" type="text/css">
		<link href="styles/library.css" rel="stylesheet" type="text/css">
		<link href="styles/lib-card.css" rel="stylesheet" type="text/css">
		<!-- СКРИПТЫ -->
		<script src="scripts/theme.js"></script>
		<script src="scripts/tenid.js"></script>
		<script src="scripts/topBar.js"></script>
		<script src='scripts/phone-check.js'></script>
		<script charset="utf-8" src="scripts/lib-card.js"></script>
		<script src="https://unpkg.com/phosphor-icons"></script>
		<meta name="viewport" content="width=device-width, maximum-scale=1, minimum-scale=1" />
	</head>
	<body>
		<nav id="nav" style="position: sticky; top: 0; margin: 0">
			<ul id="topBar" style="display: flex; align-items: center; margin: 0">
				<a id="centerLogo">библиотека</a>
			</ul>
		</nav>
		<div class="bottom-elements"></div>
		<div onclick="userBox()" class="lib-userblock">
			<img id="userPic" src="images/user.svg">
			<h5 id="lib-name">Войти</h5>
		</div>
		<!-- ОКНО ПОЛЬЗОВАТЕЛЯ -->
		<div id="userBox">
			<div id="picDiv"><img id="boxPic" src="images/user.svg"></div>
			<h3 id="name" class="centerText"></h3>
			<h5 id="userbox-email" class="centerText"></h5>
			<button onclick="changeTheme(1)" id="themeButton" class="boxButton"><i class="ph-sun boxButton-icon"></i>Светлая тема</button>
			<form action="library"><button class="boxButton" id="boxbtn-library"><i class="ph-archive boxButton-icon"></i>Библиотека</button></form>
			<form action="settings"><button class="boxButton" id="boxbtn-settings"><i class="ph-gear-six boxButton-icon"></i>Настройки</button></form>
			<form action="dev"><button class="boxButton" id="boxbtn-dev"><i class="ph-code boxButton-icon"></i>Панель разработчика</button></form>
			<form action="user"><button id="boxBtn-account" class="boxButton"><i class="ph-user-circle boxButton-icon"></i>Мой аккаунт</button></form>
			<form id="loginForm" action="login"><button onclick="logoff()" id="lastButton" class="boxButton"><i class="ph-sign-in boxButton-icon"></i>Войти</button></form>
		</div>
		<div id="library-tabs" class="tabs-2">
			<h4 class="tab-2 library-tab selected-tab-2"><i class="ph-squares-four-bold tab-icon-2"></i>Приложения</h4>
			<h4 class="tab-2 library-tab"><i class="ph-game-controller-bold tab-icon-2"></i>Игры</h4>
		</div>


		<div style="margin-top: 50px">
			<h4 id="no-elements" style="display: none">По вашему запросу ничего не нашлось.</h4>
			<div id="lib-cards" class="flex-grid">
				<div class='lib-card'>
					<img src='images/favicon.png' class='lib-card-icon'>
					<div class='flex flex-column'>
						<h5 class='lib-card-name'>TenStore для Android</h5>
						<h5 class='lib-card-dev'>Press Team</h5>
					</div>
					<a href='app?id=0'><i class='ph-share lib-card-open-icon'></i></a>
				</div>

			</div>
		<script charset="utf-8" src="scripts/library.js"></script>
		<script>login('lib'); ub_themeBtn(); ifNotFound()
			showLibCard('images/appIcons/notepads.png', '0', 'white', '36', 'Notepads', 'Jackie Liu');
			showLibCard('images/appIcons/edge.webp', '15', 'white', '14', 'Microsoft Edge', 'Microsoft');
		</script>
	</body>
</html>
