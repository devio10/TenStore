<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Приложения — TenStore</title>
	  <link rel="shortcut icon" href="images/apps.svg" type="image/png">
		<link href="styles/desktop.css" rel="stylesheet" type="text/css">
		<link href="styles/appsList-elements.css" rel="stylesheet" type="text/css">
		<!-- СКРИПТЫ -->
		<script src="scripts/theme.js"></script>
		<script src="scripts/tenid.js"></script>
		<script src="scripts/topBar.js"></script>
		<script src="scripts/appsList.js"></script>
		<script>let tag; let dev</script>
	</head>
	<body>
		<!--Окно поиска-->
		<div id="appsList-searchWindow">
			<div style="width: 100%; margin: 80px 10% 40px 10%">
				<input placeholder="Начните вводить здесь..." class="textInput searchInput">
			</div>
		</div>
		<a id="mLogo">TENSTORE</a>
		<nav style="position: sticky; top: 0;">
			<ul id="topBar" style="display: flex; align-items: center">
				<a id="logo">TENSTORE</a>
				<img style="width: 16px; margin: 0 5px 0 -2px" src="https://thetenstore.ru/images/belarus.png">
				<a class="separate" id="first">•</a>
				<a class="topItem" href="index">ГЛАВНАЯ</a>
				<a class="separate">•</a>
				<a class="topItem" id="chosen" href="appsList">ПРИЛОЖЕНИЯ</a>
				<a class="separate">•</a>
				<a class="topItem" href="appsList?type=game">ИГРЫ</a>
				<img onclick="userBox()" id="userPic" src="images/user.svg">
			</ul>
		</nav>
		<!-- ОКНО ПОЛЬЗОВАТЕЛЯ -->
		<div id="userBox">
			<h5 style="margin: 15px; font-family: var(--bold); float: left">TENID</h5>
			<img onclick="userBox()" src="images/cancel.svg" class="userBox-close">
			<div id="picDiv"><img id="boxPic" src="images/user.svg"></div>
			<h3 id="name" class="centerText"></h3>
			<form action="https://t.me/nexta_live"><button class="boxButton"><img style="filter: invert(0)" src="https://thetenstore.ru/images/belarus.png" class="boxButton-icon">#ЖивеБеларусь</button></form>
			<form action="settings"><button class="boxButton"><img src="images/settings.svg" class="boxButton-icon">Настройки</button></form>
			<button onclick="changeTheme(1)" id="themeButton" class="boxButton"><img src='images/light.svg' class='boxButton-icon'>Светлая тема</button>
			<form action="https://thetenstore.ru/tenid"><button id="boxBtn-account" class="boxButton"><img src="images/user.svg" class="boxButton-icon">Аккаунт</button></form>
			<button onclick="logoff()" id="lastButton" class="boxButton"><img src='images/login.svg' class='boxButton-icon'>Войти</button>
			<!-- <h4 class="centerText"><a href="https://t.me/nexta_live">#ЖивеБеларусь</a></h4> -->
		</div>

		<div id="appsList-dS-block">
			<div id="appsList-displaySettings">
				<img style="margin: 20px 10px 20px 20px; float: left" src="images/sort.svg" class="userBox-close">
				<h5 style="margin: 20px 20px 20px 0; font-family: var(--bold); float: left">СОРТИРОВКА</h5>
				<img style="margin: 20px" onclick="search()" src="images/cancel.svg" class="userBox-close">
				<h3 style="margin: 70px 20px 0 20px">Содержание списка</h3>
				<div style="margin: 20px">
					<input onclick="sType = 'app'" id="r1" type="radio" name="content" value="1" checked>
					<label for="r1">Приложения</label><p>
					<input onclick="sType = 'game'" id="r2" type="radio" name="content" value="2">
					<label for="r2">Игры</label><p>
					<input onclick="tag = true" id="r5" type="radio" name="content" value="3">
					<label for="r5">Определённая категория</label><p>
						<div class="selectBox">
							<label>
								<select id="selectBox">
									<option value="0" selected>Выберите категорию</option>
									<option value="action">Экшен</option>
									<option value="arcade">Аркада</option>
									<option value="communication">Связь</option>
									<option value="media">Музыка и видео</option>
									<option value="news">Новости</option>
									<option value="productivity">Продуктивность</option>
									<option value="RPG">RPG</option>
									<option value="simulator">Симуляторы</option>
									<option value="social">Социальные сети</option>
									<option value="strategy">Стратегии</option>
									<option value="utilities">Утилиты</option>
								</select>
							</label>
						</div>
					<input id="r6" type="radio" name="content" value="4">
					<label onclick="dev = true" for="r6">Определённый разработчик</label><p>
						<input style="width: 324px; height: 45px; margin: 0 20px 20px 20px" id="inpDev" class="textInput" type="text" placeholder="Введите имя разработчика">
				</div>

				<h3 style="margin: 50px 20px 0 20px">Вид карточек</h3>
				<div style="margin-left: 15px; width: 300px" id="warningBox">
					<h5 style="color: black; padding: 10px">Включите эту функцию в настройках.</h5>
				</div>
				<div style="margin: 20px 20px 30px 20px">
					<input id="r3" type="radio" name="cards" value="1" disabled checked>
					<label for="r3">Подробный</label><p>
					<input id="r4" type="radio" name="cards" value="2" disabled>
					<label for="r4">Обложка</label>
				</div>
				<button onclick="confirm()" style="margin-left: 20px" class="accentButton">Применить</button>
			</div>
		</div>

		<div id="aCard-block">

		</div>
		<button id="sortButton" onclick="search()" class="floatButton squareButton">
			<img src="images/sort.svg" class="buttonIcon accentIcon floatIcon">
		</button>
		<script>login(); ub_themeBtn(); sortButton()</script>
	</body>
</html>
