<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>TenStore</title>
	  <link rel="shortcut icon" href="images/favicon.png" type="image/png">
		<link href="styles/desktop.css" rel="stylesheet" type="text/css">
		<link href="styles/mobile.css" rel="stylesheet" type="text/css">
		<!-- СКРИПТЫ -->
		<script src="scripts/theme.js"></script>
		<script src="scripts/tenid.js"></script>
		<script src="scripts/topBar.js"></script>
	</head>
	<body>
		<a id="mLogo">TENSTORE</a>
		<nav>
			<ul id="topBar" style="display: flex; align-items: center">
				<a id="logo">TENSTORE</a>
				<img style="width: 16px; margin: 0 5px 0 -2px" src="https://thetenstore.ru/images/belarus.png">
				<a class="separate" id="first">•</a>
				<a class="topItem" id="chosen" href="index">ГЛАВНАЯ</a>
				<a class="separate">•</a>
				<a class="topItem" href="appsList">ПРИЛОЖЕНИЯ</a>
				<a class="separate">•</a>
				<a class="topItem" href="games">ИГРЫ</a>
				<img onclick="userBox()" id="userPic" src="images/user.svg">
			</ul>
		</nav>
		<!-- ОКНО ПОЛЬЗОВАТЕЛЯ -->
		<div id="userBox">
			<h5 style="margin: 15px; font-family: var(--bold); float: left">TENID</h5>
			<img onclick="userBox()" src="images/cancel.svg" class="userBox-close">
			<div id="picDiv"><img id="boxPic" src="images/user.svg"></div>
			<h3 id="name" class="centerText"></h3>
			<form action="https://t.me/nexta_live"><button class="boxButton"><img style="filter: invert(0)" src="https://thetenstore.ru/images/belarus.png" class="boxButton-icon">#ЖивеБеларусь</button></form>
			<form action="settings"><button class="boxButton"><img src="images/settings.svg" class="boxButton-icon">Настройки</button></form>
			<button onclick="changeTheme(1)" id="themeButton" class="boxButton"><img src='images/light.svg' class='boxButton-icon'>Светлая тема</button>
			<form action="https://thetenstore.ru/tenid"><button id="boxBtn-account" class="boxButton"><img src="images/user.svg" class="boxButton-icon">Аккаунт</button></form>
			<button onclick="logoff()" id="lastButton" class="boxButton"><img src='images/login.svg' class='boxButton-icon'>Войти</button>
			<!-- <h4 class="centerText"><a href="https://t.me/nexta_live">#ЖивеБеларусь</a></h4> -->
		</div>

		<div style="margin: 0 0 0 35px">
			<h1>ШОК КАНТЕНТ</h1>
			<h2>ОН ПРАВДА ЭТО ЗДЕЛАЛ??</h2>
			<h3>МЫ УЗНАЛЕ ПАДРОБНАСТИ ТАВО ДЕЛА</h3>
			<h4>АНО АКАЗАЛОСЬ НЕ ОЧИНЬ</h4>
			<h5>ДОВАЙТЕ МЫ СИЙЧАС ВСЁ РАСКАЖЕМ И ВЫ УСПОКОЕТЕСЬ</h5>
			<h6>НЕТ НЕ РАСКАЖЕМ ЭТА ШОК КАНТЕНТ</h6>
			<a class="link" href="javascript:newAlert('TENSTORE', 'hello bitches')">ну ладно нажмите сюда</a>
			<button><img class="buttonIcon" src="images/back.svg">click here</button>
		</div>


		<div id="alerts">
			<!-- уведомления здесь -->
			<div class="alert">
				<span class='closeAlert'>&times;</span>
			  <h5 style="margin: 10px">TENSTORE</h5>
			  <h5 style='margin: -5px 10px 10px 10px'>Это тестовое уведомление.</h5>
			</div>
		</div>
		<script>login(); ub_themeBtn()</script>
	</body>
</html>
