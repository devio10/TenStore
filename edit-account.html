<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Редактировать аккаунт</title>
	  <link rel="shortcut icon" href="images/edit.svg" type="image/png">
		<link href="styles/desktop.css" rel="stylesheet" type="text/css">
		<link href="styles/TenID-basic.css" rel="stylesheet" type="text/css">
		<link href="styles/mobile.css" rel="stylesheet" type="text/css">
		<!-- СКРИПТЫ -->
		<script src="scripts/theme.js"></script>
		<script src="scripts/tenid.js"></script>
		<script src="scripts/topBar.js"></script>
		<script src="scripts/edit-account.js"></script>
		<script src="https://www.google.com/recaptcha/api.js" async defer></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.js"></script>
	</head>
	<body>

		<nav>
			<ul id="topBar" style="display: flex; align-items: center">
				<img onclick="goBack()" id="backButton" src="images/back2.svg">
				<a id="mLogo2">Редактировать аккаунт</a>
				<a id="logo">TENID</a>
				<img onclick="userBox()" id="userPic" src="images/user.svg">
			</ul>
		</nav>
		<!-- ОКНО ПОЛЬЗОВАТЕЛЯ -->
		<div id="userBox">
			<h5 style="margin: 15px; font-family: var(--bold); float: left">TENID</h5>
			<img onclick="userBox()" src="images/cancel.svg" class="userBox-close">
			<div id="picDiv"><img id="boxPic" src="images/user.svg"></div>
			<h3 id="name" class="centerText"></h3>
			<form action="settings"><button class="boxButton"><img src="images/settings.svg" class="boxButton-icon">Настройки</button></form>
			<button onclick="changeTheme(1)" id="themeButton" class="boxButton"><img src='images/light.svg' class='boxButton-icon'>Светлая тема</button>
			<form action="https://thetenstore.ru/tenid"><button id="boxBtn-account" class="boxButton"><img src="images/user.svg" class="boxButton-icon">Аккаунт</button></form>
			<form action="https://t.me/nexta_live"><button class="boxButton"><img src="https://thetenstore.ru/images/belarus.svg" class="boxButton-icon">#ЖывеБеларусь</button></form>
			<form id="loginForm" action="login"><button onclick="logoff()" id="lastButton" class="boxButton"><img src='images/login.svg' class='boxButton-icon'>Войти</button></form>
		</div>

		<div id="CA-warningBox">
			<h5 style="color: black; padding: 10px">Уведомления временно недоступны.</h5>
		</div>

		<div id="EA-1step" class="CA-block">
			<img src="images/edit.svg" class="CA-block-icon">
			<h5 id="CA-block-title">РЕДАКТИРОВАТЬ АККАУНТ</h5>
			<div style="display: grid">
				<div id="CA-picDiv" style="display: block"><img id="CA-userPic" src="images/user.svg"></div>
				<input id="CA-fileInput" type="file" class="fileInput" accept="image/jpeg,image/gif,image/png">
				<input id="EA-name" placeholder="Имя" type="text" class="textInput CA-input EA-input">
				<input id="EA-lastName" placeholder="Фамилия" type="text" class="textInput CA-input EA-input">
				<input id="EA-login" placeholder="Логин" type="text" class="textInput CA-input EA-input">
			</div>
			<button onclick="EA('stage1')" class="accentButton CA-button CA-right">Подтвердить</button>
		</div>

		<div style="display: none" id="EA-2step" class="CA-block">
			<img src="images/edit.svg" class="CA-block-icon">
			<h5 id="CA-block-title">РЕДАКТИРОВАТЬ АККАУНТ</h5>
			<h3 id="CA-block-title2">Защита от ботов</h3>
			<h4 id="CA-block-text">Подтвердите, что вы не робот.</h4>
			<div style="margin-left: 20px" class="g-recaptcha" data-sitekey="6LcY78EZAAAAAPHlMlm1evtyDO0jgGuDUoGcMAS_"></div>
			<div style="display: flex; align-items: center">
				<a onclick="back('EA-1step')" href="#" style="margin: 30px" class="link CA-link">Назад</a>
				<button onclick="EA('stage2')" class="accentButton CA-button CA-right">Продолжить</button>
			</div>
		</div>

		<script>login('edit-account'); ub_themeBtn(); var onBlock</script>
		<script src="scripts/create-account.js"></script>
	</body>
</html>
