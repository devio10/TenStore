<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>TenID</title>
	<link rel="shortcut icon" href="images/favicon.png" type="image/png">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="style.css?v=1100" rel="stylesheet" type="text/css">
	<link href="mobile.css?v=1000" rel="stylesheet" type="text/css">
	<script src="scripts/login.js"></script>
</head>
<body style="overflow-y: hidden">
	<a id="mLogo">TENSTORE</a>
	<nav>
		<ul class="title" style="display: flex; align-items: center">
			<a id="logo" style="font-family: var(--bold-font)">TENID</a>
			<a id="spaceF">•</a>
			<a class="navItem" href="tenid">ПРОФИЛЬ</a>
			<a сlass="space">•</a>
			<a class="navItem" href="library">БИБЛИОТЕКА</a>
			<a сlass="space">•</a>
			<a class="navItem" href="settings">НАСТРОЙКИ</a>
			<a сlass="space">•</a>
			<a class="navItem" href="dev">DEV</a>
			<a сlass="space">•</a>
			<a class="navItem" href="register" style="font-family: var(--bold-font)">RESET_PASSWORD</a>

			<div style="display: flex; align-items: center">
				<label id="mobileSwitch" class="themeSwitch" for="checkbox">
						<input type="checkbox" id="checkbox"/>
						<div class="slider round"></div>
				</label>
			</div>
			<a id="userName" href="tenid" style="visibility: hidden"><img id="noUserPhoto" src="images/login.svg"></a>
			<a id="userName" href="tenid" style="visibility: hidden"><img id="userPhoto" src="images/login.svg" style="display: none"></a>
		</ul>
	</nav>
	<div style="margin: 0 35px 0 35px">
		<!-- <img id="userPhoto" style="width: 7%; height: auto; border-radius: 100px; margin: 30px 46.5% 0 46.5%" src="images/user.svg"> -->


		<div class="stage" id="stage1">
			<img class="titleIcon" src="images/login2.svg"></img>
			<h3 style="width: 100%; text-align: center; margin: 10px 0 30px 0">Войти в аккаунт</h3>
			<input type="text" id="login" class="regInput" placeholder="Логин" required>
			<h3></h3>
			<input type="password" id="password" class="regInput" placeholder="Пароль" required>
			<button class="accentButton" id="regBtn" onclick="loginAccount()">Войти</button>
			<h3 style="width: 100%; text-align: center; margin: 15px 0 0 0; font-family: var(--regular-font); font-size: 12px">или</h3>
			<a href="register"><button class="outlineButton" id="regBtn" style="margin-top: 15px">Создать аккаунт</button></a>
		</div>

		<div class="stage" id="stage2" style="display: none">
			<img class="titleIcon" src="images/userPhoto.svg"></img>
			<h3 id="name" style="width: 100%; text-align: center; margin: 10px 0 15px 0">Здесь имя</h3>
			<h3 id="mail" style="width: 100%; text-align: center; margin: 0 0 30px 0; font-size: 12px">а здесь почта, ок да?</h3>
			<button class="accentButton" id="regBtn" onclick="saveAccount()">Продолжить</button>
			<button class="outlineButton" id="regBtn" style="margin-top: 15px" onclick="notMe()">Это не я</button>
		</div>

		<div class="stage" id="alreadyExists" style="display: none">
			<img class="titleIcon" src="images/userPhoto.svg"></img>
			<h3 style="width: 100%; text-align: center; margin: 10px 0 15px 0">Вы уже вошли в аккаунт</h3>
			<a href="index"><button class="accentButton" id="regBtn">На главную</button></a>
			<button class="outlineButton" id="regBtn" style="margin-top: 15px" onclick="logOff()">Выйти из аккаунта</button>
		</div>
	</div>
	</div>

	<div id="notPlace">
		<!-- уведомления здесь -->
	</div>

	<div class="loader-wrapper">
		<span class="loader"><span class="loader-inner"></span></span>
	</div>
	<script type="text/javascript" src="https://code.jquery.com/jquery-3.5.0.min.js"></script>
	<script src="scripts/loadScreen.js"></script>
	<script src="scripts/closeNotification.js"></script>
	<script src="scripts/newNotification.js"></script>
	<script src="scripts/theme.js"></script>
	<script src="scripts/setupNot.js"></script>
	<script src="scripts/goBack.js"></script>
	<script src="scripts/login.js"></script>
	<script>login()</script>
	<script>checkLogin()</script>
</body>
</html>
